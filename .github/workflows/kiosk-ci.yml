name: Kiosk CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  kiosk-pipeline:
    name: Kiosk Quality & Test Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: LocalMaster_Kiosk/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Zero-Hardcoding Static Audit
        run: npm run audit:hardcode

      - name: TypeScript Type Check (Strict 0-Error)
        run: npx tsc --noEmit

      - name: Hardware Bridge & Multi-VAN Unit Tests (Vitest 14 Scenarios)
        run: npm run test:unit

      - name: Production Bundle Build Verification
        run: npm run build
